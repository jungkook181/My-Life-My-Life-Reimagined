
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#17121e">
    <meta name="description" content="A personal archive of art, memories and golden moments.">

    <title>My Life, My Life — The Grand Archive</title>

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="css/style.css?v=3">
</head>

<body>

    <main class="intro-screen">

        <!-- Background atmosphere -->
        <div class="background-layer" aria-hidden="true">
            <div class="ambient-glow"></div>
            <div class="grain-overlay"></div>
        </div>

        <!-- Decorative celestial elements -->
        <div class="celestial-layer" aria-hidden="true">

            <span class="celestial-star star-one">✧</span>
            <span class="celestial-star star-two">✦</span>
            <span class="celestial-star star-three">⋆</span>
            <span class="celestial-star star-four">✧</span>

            <div class="orbit orbit-one"></div>
            <div class="orbit orbit-two"></div>

            <span class="royal-crown">♔</span>

        </div>

        <!-- Editorial frame -->
        <div class="archive-frame" aria-hidden="true">

            <span class="corner corner-top-left"></span>
            <span class="corner corner-top-right"></span>
            <span class="corner corner-bottom-left"></span>
            <span class="corner corner-bottom-right"></span>

        </div>

        <!-- Top archive information -->
        <header class="archive-header">

            <p class="archive-label">
                THE GOLDEN ARCHIVE
            </p>

            <p class="archive-edition">
                A WORLD OF MEMORIES · 01
            </p>

        </header>

        <!-- Main editorial composition -->
        <section class="hero-composition">

            <div class="hero-side-note">
                <span class="side-line"></span>
                <p>AN UNFINISHED COLLECTION</p>
            </div>

            <div class="hero-main">

                <p class="hero-eyebrow">
                    A LITTLE WORLD OF ITS OWN
                </p>

                <h1 class="main-title">
                    My Life,
                    <span>My Life</span>
                </h1>

                <div class="title-ornament" aria-hidden="true">
                    <span></span>
                    <span class="ornament-star">✧</span>
                    <span></span>
                </div>

                <p class="dedication">
                    Only for you, Jungkook..
                </p>

                <button class="enter-button" type="button">
                    <span>ENTER THE WORLD</span>
                    <span class="button-star">✧</span>
                </button>

            </div>

            <div class="hero-side-number" aria-hidden="true">
                <span>J</span>
                <span>30</span>
                <span>♔</span>
            </div>

        </section>

        <!-- Bottom signature -->
        <footer class="archive-footer">

            <div class="footer-divider"></div>

            <div class="signature">
                <p>By: Jessia For Jeon☆</p>
                <p>To: Jeon Jungkook♔</p>
            </div>

            <p class="footer-note">
                MADE OF MEMORIES & GOLDEN MOMENTS
            </p>

        </footer>

    </main>

</body>
</html>
